name: Paper trading bot

# Watches NQ every minute during the session and posts paper entries/exits to
# Discord. Trades are logged to paper/trades.csv.
#
# GitHub's scheduler often starts jobs late or skips them, so the schedule fires
# every 10 minutes from 12:00 to 20:59 UTC on weekdays (covers 8:00am-4:10pm ET
# in both EDT and EST). The concurrency group keeps only one bot running; extra
# triggers wait or are dropped, and a bot that starts outside the session exits
# right away. Each run pulls the latest state first, so nothing is posted twice.
on:
  schedule:
    - cron: "*/10 12-20 * * 1-5"
  workflow_dispatch:
    inputs:
      once:
        description: "Run a single pass and exit (test)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.40" pandas numpy requests
      - name: Run bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          git config user.name "paper-bot"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin main || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.once }}" = "true" ]; then
            python paper/bot.py --once
            exit 0
          fi
          H=$(TZ=America/New_York date +%H%M)
          D=$(TZ=America/New_York date +%u)
          if [ "$D" -gt 5 ] || [ "$H" -lt 815 ] || [ "$H" -ge 1610 ]; then echo "Outside session ($H ET)"; exit 0; fi
          # Run to the session end, in chunks that fit GitHub's time limit.
          if [ "$H" -lt 1200 ]; then python paper/bot.py --until 1200
          else python paper/bot.py --until 1610; fi
